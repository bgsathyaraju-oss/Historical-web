name: Deploy React Website to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck codebase
        run: bun run lint

      - name: Build website for Firebase Hosting (root base path)
        env:
          VITE_BASE_PATH: /
          PUBLIC_SITE_URL: https://historical-web.web.app
          PRERENDER_STATIC_DIRS: 'true'
        run: bun run build

      - name: Resolve Firebase Deployment Credentials
        id: firebase_creds
        env:
          SA_HISTORICAL_WEB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HISTORICAL_WEB }}
          SA_GENERIC: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_GCP: ${{ secrets.GCP_SA_KEY }}
          FB_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SA_HISTORICAL_WEB" ]; then
            echo "mode=service_account_historical_web" >> "$GITHUB_OUTPUT"
          elif [ -n "$SA_GENERIC" ]; then
            echo "mode=service_account_generic" >> "$GITHUB_OUTPUT"
          elif [ -n "$SA_GCP" ]; then
            echo "mode=service_account_gcp" >> "$GITHUB_OUTPUT"
          elif [ -n "$FB_TOKEN" ]; then
            echo "mode=firebase_token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::No Firebase deployment secret (FIREBASE_SERVICE_ACCOUNT_HISTORICAL_WEB, FIREBASE_SERVICE_ACCOUNT, GCP_SA_KEY, or FIREBASE_TOKEN) is set in GitHub Repository Secrets yet. Build succeeded; skipping live Firebase Hosting push."
          fi

      - name: Deploy to Firebase Hosting (FIREBASE_SERVICE_ACCOUNT_HISTORICAL_WEB)
        if: steps.firebase_creds.outputs.mode == 'service_account_historical_web'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HISTORICAL_WEB }}
          channelId: live
          projectId: historical-web

      - name: Deploy to Firebase Hosting (FIREBASE_SERVICE_ACCOUNT)
        if: steps.firebase_creds.outputs.mode == 'service_account_generic'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: historical-web

      - name: Deploy to Firebase Hosting (GCP_SA_KEY)
        if: steps.firebase_creds.outputs.mode == 'service_account_gcp'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          channelId: live
          projectId: historical-web

      - name: Deploy to Firebase Hosting (FIREBASE_TOKEN CLI)
        if: steps.firebase_creds.outputs.mode == 'firebase_token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools deploy --only hosting --project historical-web --token "$FIREBASE_TOKEN"
