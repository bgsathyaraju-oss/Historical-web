    <!-- Early WebView Error Capture & Startup Watchdog (must run before module scripts) -->
    <script>
      (function () {
        window.__PORTAL_ERROR_LOG__ = window.__PORTAL_ERROR_LOG__ || [];

        function isBenignDiagnostic(detailStr) {
          var s = String(detailStr || '').toLowerCase();
          return (
            s.indexOf('websocket') !== -1 ||
            s.indexOf('vite') !== -1 ||
            s.indexOf('hmr') !== -1 ||
            s.indexOf('failed to fetch') !== -1 ||
            s.indexOf('networkerror') !== -1 ||
            s.indexOf('load failed') !== -1
          );
        }

        function recordError(source, detail) {
          try {
            var detailStr = String(detail || 'Unknown error');
            if (isBenignDiagnostic(detailStr)) return;
            window.__PORTAL_ERROR_LOG__.push({
              time: new Date().toISOString(),
              source: source,
              detail: detailStr
            });
            if (window.console && window.console.warn) {
              window.console.warn('[Portal Boot Diagnostic - ' + source + ']', detailStr);
            }
          } catch (e) {}
        }

        window.__SHOW_PORTAL_FALLBACK__ = function (reason) {
          try {
            var root = document.getElementById('root');
            if (!root) return;
            var loader = document.getElementById('portal-boot-loader');
            if (window.__PORTAL_MOUNTED__ && !loader && root.children.length > 0) return;

            var safeReason = String(reason || 'The application script could not finish initializing in this WebView.').replace(/[<>]/g, '');
            root.innerHTML =
              '<div style="padding:16px;background:#120910;color:#f7f5f0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;">' +
                '<div style="max-width:520px;margin:16px auto;background:#181c2a;border:2px solid #d4af37;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,0.6);">' +
                  '<div style="color:#d4af37;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;">Suryavamsha Odiyaraju Kshatriya Portal • WebView Diagnostic</div>' +
                  '<h1 style="color:#fcedc7;font-size:18px;margin:10px 0;">Unable to Complete Page Load</h1>' +
                  '<p style="color:#e7e5e4;font-size:13px;line-height:1.5;margin:0 0 12px;">A script, network cache, or WebView restriction prevented the portal from finishing initialization.</p>' +
                  '<div style="background:#090b12;border:1px solid #c99738;color:#fde68a;padding:12px;border-radius:10px;font-size:12px;font-family:monospace;word-break:break-word;margin-bottom:16px;">Diagnostic: ' + safeReason + '</div>' +
                  '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
                    '<button onclick="window.location.href=\'/?v=\'+Date.now()" style="background:#d4af37;color:#290106;border:none;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;">Reload Fresh Copy</button>' +
                    '<a href="/?v=fresh" style="background:#261019;color:#fcedc7;border:1px solid #d4af37;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;text-decoration:none;display:inline-block;">Open Home Page</a>' +
                  '</div>' +
                '</div>' +
              '</div>';
          } catch (e) {}
        };

        window.addEventListener('error', function (event) {
          var target = event && event.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var url = target.src || target.href || 'asset';
            recordError('AssetLoadError', 'Failed to load ' + target.tagName + ': ' + url);
            if (target.tagName === 'SCRIPT') {
              setTimeout(function () {
                window.__SHOW_PORTAL_FALLBACK__('Failed to load JavaScript bundle (' + url + '). Please tap Reload Fresh Copy.');
              }, 400);
            }
            return;
          }
          var msg = (event && event.message) ? event.message : 'Runtime script error';
          recordError('WindowError', msg);
          setTimeout(function () {
            window.__SHOW_PORTAL_FALLBACK__(msg);
          }, 400);
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = reason && reason.message ? reason.message : String(reason || 'Unhandled promise rejection');
          if (isBenignDiagnostic(msg)) {
            if (event && typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
            return;
          }
          recordError('UnhandledRejection', msg);
        });

        setTimeout(function () {
          var root = document.getElementById('root');
          var loader = document.getElementById('portal-boot-loader');
          if (!window.__PORTAL_MOUNTED__ || loader || (root && root.children.length === 0)) {
            var lastErr = window.__PORTAL_ERROR_LOG__.length > 0
              ? window.__PORTAL_ERROR_LOG__[window.__PORTAL_ERROR_LOG__.length - 1].detail
              : 'Application script timed out or was blocked by WebView cache/settings.';
            window.__SHOW_PORTAL_FALLBACK__(lastErr);
          }
        }, 8000);
      })();
    </script>
