    <!-- Early WebView Error Capture & Startup Watchdog (must run before module scripts) -->
    <script>
      (function () {
        window.__PORTAL_ERROR_LOG__ = window.__PORTAL_ERROR_LOG__ || [];

        function isBenignDiagnostic(detailStr) {
          var s = String(detailStr || '').toLowerCase();
          return (
            s.indexOf('websocket') !== -1 ||
            s.indexOf('vite') !== -1 ||
            s.indexOf('hmr') !== -1 ||
            s.indexOf('failed to fetch') !== -1 ||
            s.indexOf('networkerror') !== -1 ||
            s.indexOf('load failed') !== -1
          );
        }

        function recordError(source, detail) {
          try {
            var detailStr = String(detail || 'Unknown error');
            if (isBenignDiagnostic(detailStr)) return;
            window.__PORTAL_ERROR_LOG__.push({
              time: new Date().toISOString(),
              source: source,
              detail: detailStr
            });
            if (window.console && window.console.warn) {
              window.console.warn('[Portal Boot Diagnostic - ' + source + ']', detailStr);
            }
          } catch (e) {}
        }

        window.__SHOW_PORTAL_FALLBACK__ = function (reason) {
          try {
            var root = document.getElementById('root');
            if (!root) return;
            var loader = document.getElementById('portal-boot-loader');
            if (window.__PORTAL_MOUNTED__ && !loader && root.children.length > 0) return;

            var safeReason = String(reason || 'The application script could not finish initializing in this WebView.').replace(/[<>]/g, '');
            root.innerHTML =
              '<div style="padding:16px;background:#F5EBD9;color:#292521;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;">' +
                '<div style="max-width:520px;margin:16px auto;background:#FFFCF5;border:2px solid #A87924;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(84,53,31,0.12);">' +
                  '<div style="color:#76501F;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;">Suryavamsha Odiyaraju Kshatriya Portal • WebView Diagnostic</div>' +
                  '<h1 style="color:#54351F;font-size:18px;margin:10px 0;">Unable to Complete Page Load</h1>' +
                  '<p style="color:#292521;font-size:13px;line-height:1.5;margin:0 0 12px;">A script, network cache, or WebView restriction prevented the portal from finishing initialization.</p>' +
                  '<div style="background:#FFF9EF;border:1px solid #A87924;color:#54351F;padding:12px;border-radius:10px;font-size:12px;font-family:monospace;word-break:break-word;margin-bottom:16px;">Diagnostic: ' + safeReason + '</div>' +
                  '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
                    '<button onclick="window.location.href=\'/?v=\'+Date.now()" style="background:#762D35;color:#FFFFFF;border:none;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;">Reload Fresh Copy</button>' +
                    '<a href="/?v=fresh" style="background:#FFF9EF;color:#54351F;border:1px solid #A87924;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;text-decoration:none;display:inline-block;">Open Home Page</a>' +
                  '</div>' +
                '</div>' +
              '</div>';
          } catch (e) {}
        };

        window.addEventListener('error', function (event) {
          var target = event && event.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var url = target.src || target.href || 'asset';
            recordError('AssetLoadError', 'Failed to load ' + target.tagName + ': ' + url);
            if (target.tagName === 'SCRIPT') {
              setTimeout(function () {
                window.__SHOW_PORTAL_FALLBACK__('Failed to load JavaScript bundle (' + url + '). Please tap Reload Fresh Copy.');
              }, 400);
            }
            return;
          }
          var msg = (event && event.message) ? event.message : 'Runtime script error';
          recordError('WindowError', msg);
          setTimeout(function () {
            window.__SHOW_PORTAL_FALLBACK__(msg);
          }, 400);
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = reason && reason.message ? reason.message : String(reason || 'Unhandled promise rejection');
          if (isBenignDiagnostic(msg)) {
            if (event && typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
            return;
          }
          recordError('UnhandledRejection', msg);
        });

        setTimeout(function () {
          var root = document.getElementById('root');
          var loader = document.getElementById('portal-boot-loader');
          if (!window.__PORTAL_MOUNTED__ || loader || (root && root.children.length === 0)) {
            var lastErr = window.__PORTAL_ERROR_LOG__.length > 0
              ? window.__PORTAL_ERROR_LOG__[window.__PORTAL_ERROR_LOG__.length - 1].detail
              : 'Application script timed out or was blocked by WebView cache/settings.';
            window.__SHOW_PORTAL_FALLBACK__(lastErr);
          }
        }, 8000);

        // Early WhatsApp URL Normalization & AppInventor WebView Interceptor (prevents ERR_UNKNOWN_URL_SCHEME)
        function isWhatsAppHref(u) {
          if (!u || typeof u !== 'string') return false;
          var t = u.trim();
          return /^whatsapp:\/\//i.test(t) || /^https?:\/\/(www\.)?wa\.me(\/|\?|$)/i.test(t) || /^https?:\/\/(api|web)\.whatsapp\.com\/send(\/|\?|$)/i.test(t);
        }

        function toHttpsWaMeUrl(u) {
          var t = String(u || '').trim();
          if (/^https?:\/\/(www\.)?wa\.me(\/|\?|$)/i.test(t)) {
            return t.replace(/^http:\/\//i, 'https://').replace(/^https:\/\/www\.wa\.me/i, 'https://wa.me');
          }
          var qIdx = t.indexOf('?');
          if (qIdx === -1) return 'https://wa.me/';
          var pairs = t.slice(qIdx + 1).split('&');
          var phone = '';
          var kept = [];
          for (var i = 0; i < pairs.length; i++) {
            var p = pairs[i];
            if (!p) continue;
            var eq = p.indexOf('=');
            var k = (eq === -1 ? p : p.slice(0, eq)).toLowerCase();
            var v = eq === -1 ? '' : p.slice(eq + 1);
            if (k === 'phone') {
              try { phone = decodeURIComponent(v).replace(/[^\d]/g, ''); } catch (e) { phone = v.replace(/[^\d]/g, ''); }
            } else {
              kept.push(p);
            }
          }
          return 'https://wa.me/' + phone + (kept.length ? '?' + kept.join('&') : '');
        }

        document.addEventListener('click', function (ev) {
          try {
            if (window.__ANDROID_WEBVIEW_INTERCEPTOR_INSTALLED__) return;
            var el = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
            if (!el) return;
            var href = el.getAttribute('href') || el.href || '';
            if (!isWhatsAppHref(href)) return;
            var waUrl = toHttpsWaMeUrl(href);
            var ua = (navigator && navigator.userAgent) || '';
            var hasBridge = Boolean(window.AppInventor && typeof window.AppInventor.setWebViewString === 'function');
            var isWebView = hasBridge || (/Android/i.test(ua) && /;\s*wv\)|\bwv\b|Version\/\d+\.\d+.*Chrome\/|AppInventor|WebView/i.test(ua));
            if (isWebView) {
              ev.preventDefault();
              ev.stopPropagation();
              if (hasBridge) {
                window.AppInventor.setWebViewString(waUrl);
              } else {
                window.open(waUrl, '_blank', 'noopener,noreferrer');
              }
            }
          } catch (e) {}
        }, true);
      })();
    </script>
